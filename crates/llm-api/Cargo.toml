[package]
name = "mhome-llm-api"
version = "3.0.1"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Canonical model messages, completions and continuation contracts"
readme = "README.md"
publish = ["crates-io"]
include = ["src/**", "tests/**", "schema/**", "fixtures/**", "manifest/**", "Cargo.toml", "README.md", "LICENSE"]

[lib]
name = "llm_api"

[dependencies]
artifact-api = { package = "mhome-artifact-api", version = "=1.2.0", path = "../artifact" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
