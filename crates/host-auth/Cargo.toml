[package]
name = "mhome-host-auth"
version = "1.8.6"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Host authentication, Client sessions, and optional pinned LAN TLS"
readme = "README.md"
publish = ["crates-io"]
include = ["src/**", "tests/**", "Cargo.toml", "README.md", "LICENSE"]

[lib]
name = "host_auth"

[dependencies]
core-api = { package = "mhome-core-api", version = "=1.52.3", path = "../core-api" }
anyhow = "1"
base64 = "0.22"
http = "1"
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[features]
local-state = ["dep:fs2", "dep:tempfile", "dep:libc", "dep:windows-sys"]
authority = ["local-state", "tls-server", "dep:reqwest", "reqwest/json", "dep:tokio-util", "dep:jsonwebtoken", "dep:tracing", "dep:libc", "dep:windows-sys", "tokio/sync", "tokio/rt", "tokio/macros", "axum/json"]
file-gateway = ["tls-server", "dep:reqwest", "dep:tokio-util", "dep:futures-util", "dep:async-stream"]
tls-server = ["tls", "dep:axum"]
tls = ["dep:fs2", "dep:tempfile", "dep:rustls", "dep:rcgen", "dep:x509-parser", "dep:tokio-rustls", "dep:tokio"]

[dependencies.rustls]
version = "0.23"
default-features = false
features = ["ring", "std", "tls12"]
optional = true

[dependencies.tokio-rustls]
version = "0.26"
default-features = false
features = ["ring", "tls12"]
optional = true

[dependencies.tokio]
version = "1"
features = ["net", "time"]
optional = true

[dependencies.rcgen]
version = "0.13"
optional = true

[dependencies.x509-parser]
version = "0.16"
optional = true

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-util"] }

[dependencies.axum]
version = "0.8"
default-features = false
features = ["tokio", "http1"]
optional = true

[dependencies.fs2]
version = "0.4"
optional = true

[dependencies.tempfile]
version = "3"
optional = true

[dependencies.reqwest]
version = "0.12"
default-features = false
features = ["rustls-tls", "stream"]
optional = true

[dependencies.tokio-util]
version = "0.7"
features = ["rt"]
optional = true

[dependencies.futures-util]
version = "0.3"
optional = true

[dependencies.async-stream]
version = "0.3"
optional = true

[dependencies.jsonwebtoken]
version = "9"
optional = true
[dependencies.tracing]
version = "0.1"
optional = true
[target.'cfg(unix)'.dependencies.libc]
version = "0.2"
optional = true
[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.61"
features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading"]
optional = true
[dev-dependencies.rsa]
version = "0.9"
features = ["pem"]
