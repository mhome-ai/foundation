[package]
name = "mhome-messaging-api"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Typed wire contract for mHome messaging provider management"
readme = "README.md"
publish = ["crates-io"]
include = ["src/**", "tests/**", "schema/**", "fixtures/**", "manifest/**", "Cargo.toml", "README.md", "LICENSE"]

[lib]
name = "messaging_api"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
jsonschema = { version = "0.30", default-features = false }
