[package]
name = "mhome-playground-models"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Deterministic playground device models and state projections for mHome"
readme = "README.md"
publish = ["crates-io"]
include = ["src/**", "Cargo.toml", "README.md", "LICENSE"]

[lib]
name = "playground_models"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
