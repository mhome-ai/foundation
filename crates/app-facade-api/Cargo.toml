[package]
name = "mhome-app-facade-api"
version = "1.0.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Canonical public App Facade protocol for MeowLink clients"
readme = "README.md"
publish = ["crates-io"]
include = ["src/**", "tests/**", "schema/**", "fixtures/**", "manifest/**", "Cargo.toml", "README.md", "LICENSE"]

[lib]
name = "app_facade_api"

[dependencies]
core-api = { package = "mhome-core-api", version = "=1.4.0", path = "../core-api" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
jsonschema = { version = "0.30", default-features = false }
