[package]
name = "mhome-core-api"
version = "1.75.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Shared wire types and service contracts for the mHome core"
readme = "README.md"
publish = ["crates-io"]
include = ["src/**", "tests/**", "contract/**", "manifest/**", "schema/**", "fixtures/**", "Cargo.toml", "README.md", "LICENSE", "NOTICE"]

[lib]
name = "core_api"

[dependencies]
script-api = { package = "mhome-script-api", version = "=0.3.2", path = "../script-api" }
storage-api = { package = "mhome-storage-api", version = "=0.4.2", path = "../storage-api" }
runtime-paths = { package = "mhome-runtime-paths", version = "=1.2.1", path = "../runtime-paths" }
llm-api = { package = "mhome-llm-api", version = "=3.5.1", path = "../llm-api" }
base64 = "0.22"
sha2 = "0.10"
artifact-api = { package = "mhome-artifact-api", version = "=1.16.1", path = "../artifact" }
conversation-api = { package = "mhome-conversation-api", version = "=5.3.2", path = "../conversation-api" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
minisign-verify = "0.2.5"
jsonschema = { version = "0.30", default-features = false }
