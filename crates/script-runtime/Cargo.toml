[package]
name = "mhome-script-runtime"
version = "0.1.4"
rust-version = "1.95"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Shared bounded native QuickJS execution for MeowCore scripts"
readme = "README.md"

[dependencies]
mhome-script-api = { version = "=0.1.2", path = "../script-api" }
rquickjs = { version = "=0.14.0", features = ["futures", "loader"] }
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }

# Upstream ships pre-generated bindings for desktop/Linux, but not Android/iOS.
# Cross builds generate the FFI declarations using the target SDK headers.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
rquickjs = { version = "=0.14.0", features = ["bindgen"] }

[dev-dependencies]
serde_json = "1"
