name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: clippy,rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Build documentation
        run: cargo doc --workspace --no-deps --locked
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Verify protocol npm packages
        run: |
          npm run test:protocol-packages
          for protocol in conversation messaging plugin; do
            staging="$(mktemp -d)/package"
            node scripts/stage-protocol-package.mjs "${protocol}" "${staging}"
            npm pack "${staging}" --dry-run
          done
