[package]
name = "mhome-host-auth"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Transport-independent Host authentication and Client session rules"
readme = "README.md"
publish = ["crates-io"]
include = ["src/**", "tests/**", "Cargo.toml", "README.md", "LICENSE"]

[lib]
name = "host_auth"

[dependencies]
core-api = { package = "mhome-core-api", version = "=1.15.6", path = "../core-api" }
anyhow = "1"
base64 = "0.22"
http = "1"
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
