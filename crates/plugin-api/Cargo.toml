[package]
name = "mhome-plugin-api"
version = "0.3.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Typed wire contracts for mHome Plugin App Facade"
readme = "README.md"
publish = ["crates-io"]
include = ["src/**", "contract/**", "Cargo.toml", "README.md", "LICENSE"]

[lib]
name = "plugin_api"

[dependencies]
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
serde_json = "1.0"
