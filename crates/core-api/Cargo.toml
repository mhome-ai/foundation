[package]
name = "mhome-core-api"
version = "1.0.2"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Shared wire types and service contracts for the mHome core"
readme = "README.md"
publish = ["crates-io"]
include = ["src/**", "Cargo.toml", "README.md", "LICENSE"]

[lib]
name = "core_api"

[dependencies]
artifact-api = { package = "mhome-artifact-api", version = "=1.0.1", path = "../artifact" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
