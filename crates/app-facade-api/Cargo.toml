[package]
name = "mhome-app-facade-api"
version = "1.137.3"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Canonical public App Facade protocol for MeowLink clients"
readme = "README.md"
publish = ["crates-io"]
include = ["src/**", "tests/**", "schema/**", "fixtures/**", "manifest/**", "contract/**", "Cargo.toml", "README.md", "SYSTEM.md", "LICENSE", "NOTICE"]

[lib]
name = "app_facade_api"

[dependencies]
pulldown-cmark = { version = "0.13.4", default-features = false }
storage-api = { package = "mhome-storage-api", version = "=0.4.2", path = "../storage-api" }
llm-api = { package = "mhome-llm-api", version = "=3.5.1", path = "../llm-api" }
person-api = { package = "mhome-person-api", version = "=1.2.1", path = "../person-api" }
core-api = { package = "mhome-core-api", version = "=1.76.0", path = "../core-api" }
artifact-api = { package = "mhome-artifact-api", version = "=1.16.1", path = "../artifact" }
conversation-api = { package = "mhome-conversation-api", version = "=5.5.0", path = "../conversation-api" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = "0.10"

[dev-dependencies]
jsonschema = { version = "0.30", default-features = false }
