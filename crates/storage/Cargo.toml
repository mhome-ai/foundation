[package]
name = "mhome-storage"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Platform object storage catalog and durable disk backend"
readme = "README.md"
publish = ["crates-io"]
include = ["src/**", "migrations/**", "tests/**", "Cargo.toml", "README.md", "LICENSE"]

[dependencies]
anyhow = "1"
async-trait = "0.1"
fs2 = "0.4"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tokio = { version = "1", features = ["fs", "io-util", "sync", "rt", "macros"] }
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
