[package]
name = "mhome-os-permissions"
version = "1.3.3"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "In-process operating-system permission status, requests, and Settings links"
readme = "README.md"
publish = ["crates-io"]
include = ["src/**", "native/**", "build.rs", "Cargo.toml", "README.md", "LICENSE"]

[lib]
name = "os_permissions"

[dependencies]
core-api = { package = "mhome-core-api", version = "=1.24.0", path = "../core-api" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Devices_Bluetooth", "Win32_Foundation"] }

[build-dependencies]
cc = "1"
