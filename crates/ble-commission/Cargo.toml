[package]
name = "mhome-ble-commission"
version = "0.16.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Platform-neutral BLE/LAN discovery, pod commissioning and Host provisioning for MeowLink native Clients"
readme = "README.md"
publish = ["crates-io"]
include = ["src/**", "tests/**", "Cargo.toml", "README.md", "LICENSE", "NOTICE"]

[lib]
name = "ble_commission"

[dependencies]
host-protocol = { package = "mhome-host-auth", version = "=1.16.1", path = "../host-auth" }
app-facade-api = { package = "mhome-app-facade-api", version = "=1.142.0", path = "../app-facade-api" }
async-trait = "0.1"
core-api = { package = "mhome-core-api", version = "=1.77.0", path = "../core-api" }
protocomm = { package = "mhome-protocomm", version = "=0.2.2", path = "../protocomm" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync", "time", "net"] }
tracing = "0.1"
reqwest = { version = "0.12", default-features = false }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
socket2 = { version = "0.6", features = ["all"] }

zeroize = "1"
uuid = { version = "1.11", features = ["v4"] }
base64 = "0.22"
ed25519-dalek = "2"
hex = "0.4"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Networking_WinSock"] }

[dev-dependencies]
prost = "0.13"
tokio = { version = "1", features = ["macros", "rt", "sync", "test-util", "time", "io-util", "net"] }
