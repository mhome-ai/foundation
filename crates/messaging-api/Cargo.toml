[package]
name = "mhome-messaging-api"
version = "0.12.1"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Typed control and normalized data-plane contracts for mHome messaging"
readme = "README.md"
publish = ["crates-io"]
include = ["src/**", "tests/**", "schema/**", "fixtures/**", "manifest/**", "Cargo.toml", "README.md", "LICENSE"]

[lib]
name = "messaging_api"

[dependencies]
conversation-api = { package = "mhome-conversation-api", version = "0.11", path = "../conversation-api" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
jsonschema = { version = "0.30", default-features = false }
