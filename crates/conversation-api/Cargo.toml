[package]
name = "mhome-conversation-api"
version = "3.0.0"
edition = "2024"
rust-version = "1.94"
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Typed wire contract for the mHome conversation API"
readme = "README.md"
publish = ["crates-io"]
include = ["src/**", "tests/**", "schema/**", "fixtures/**", "manifest/**", "Cargo.toml", "README.md", "LICENSE"]

[lib]
name = "conversation_api"

[dependencies]
llm-api = { package = "mhome-llm-api", version = "=3.0.0", path = "../llm-api" }
artifact-api = { package = "mhome-artifact-api", version = "=1.2.0", path = "../artifact" }
async-trait = "0.1"
thiserror = "2"
serde_ignored = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"

[dev-dependencies]
jsonschema = { version = "0.30", default-features = false }
