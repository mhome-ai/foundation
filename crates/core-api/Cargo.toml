[package]
name = "mhome-core-api"
version = "1.1.2"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Shared wire types and service contracts for the mHome core"
readme = "README.md"
publish = ["crates-io"]
include = ["src/**", "contract/**", "manifest/**", "schema/**", "fixtures/**", "Cargo.toml", "README.md", "LICENSE"]

[lib]
name = "core_api"

[dependencies]
artifact-api = { package = "mhome-artifact-api", version = "=1.1.1", path = "../artifact" }
conversation-api = { package = "mhome-conversation-api", version = "=1.1.1", path = "../conversation-api" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
jsonschema = { version = "0.30", default-features = false }
