[package]
name = "mhome-artifact-api"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Storage-independent artifact references shared by mHome runtimes"
readme = "README.md"
keywords = ["artifact", "content-addressed", "media"]
categories = ["data-structures", "encoding"]
publish = ["crates-io"]
include = ["src/**", "Cargo.toml", "README.md", "LICENSE"]

[lib]
name = "artifact_api"

[dependencies]
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
