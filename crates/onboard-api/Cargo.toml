[package]
name = "mhome-onboard-api"
version = "0.3.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Product onboarding wire contracts for Space Host, Pod and Wave devices"
readme = "README.md"
publish = ["crates-io"]
include = ["src/**", "tests/**", "schema/**", "fixtures/**", "manifest/**", "contract/**", "Cargo.toml", "README.md", "LICENSE", "NOTICE"]

[lib]
name = "onboard_api"

[dependencies]
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"

[dev-dependencies]
serde_json = "1"
jsonschema = { version = "0.30", default-features = false }
