[package]
name = "mhome-protocomm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "ESP-IDF protocomm security 2 and Wi-Fi provisioning messages, commissioner and device side"
readme = "README.md"
publish = ["crates-io"]
include = ["src/**", "tests/**", "Cargo.toml", "README.md", "LICENSE"]

[lib]
name = "protocomm"

[dependencies]
aes-gcm = "0.10"
async-trait = "0.1"
num-bigint = "0.4"
prost = "0.13"
rand = "0.8"
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["sync", "time"] }

[dev-dependencies]
hex = "0.4"
tokio = { version = "1", features = ["macros", "rt"] }
