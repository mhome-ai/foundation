name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  release-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - name: Install publication client
        run: npm install --global npm@12.2.1 --ignore-scripts --no-audit --no-fund
      - name: Install protocol verification tools
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify publication tools on Linux
        run: npm run test:protocol-packages
  rust:
    runs-on: [self-hosted, macOS, ARM64, release-macos-primary]
    steps:
      - name: Prepare source from runner repositories
        id: source
        shell: bash
        run: |
          set -euo pipefail
          tools_repo="$HOME/.mhome/releases"
          test -e "$tools_repo/.git" || { echo "Provision ~/.mhome/releases before running CI" >&2; exit 1; }
          git -C "$tools_repo" fetch origin +refs/heads/main:refs/remotes/origin/main
          tools_revision="$(git -C "$tools_repo" rev-parse refs/remotes/origin/main)"
          helper="$RUNNER_TEMP/source-worktree-${GITHUB_RUN_ID}-${GITHUB_JOB}-${GITHUB_RUN_ATTEMPT}.cjs"
          git -C "$tools_repo" show "$tools_revision:scripts/ci/source-worktree.cjs" > "$helper"
          node - "$helper" <<'JS'
          const fs = require('node:fs'), path = require('node:path'), os = require('node:os');
          const helper = process.argv[2], root = path.join(os.homedir(), '.mhome');
          const result = require(helper).prepare({
            root, name: 'foundation', revision: process.env.GITHUB_SHA, reference: process.env.GITHUB_REF,
            run: process.env.GITHUB_RUN_ID, job: process.env.GITHUB_JOB, attempt: process.env.GITHUB_RUN_ATTEMPT,
          });
          const file = path.join(process.env.RUNNER_TEMP, `foundation-source-${process.env.GITHUB_RUN_ID}-${process.env.GITHUB_JOB}-${process.env.GITHUB_RUN_ATTEMPT}.json`);
          fs.writeFileSync(file, JSON.stringify({helper, root, work: result.MHOME_WORK_ROOT}), {mode: 0o600});
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `directory=${result.MHOME_SOURCE_DIR}\n`);
          JS
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy,rustfmt
      - name: Check formatting
        working-directory: ${{ steps.source.outputs.directory }}
        run: cargo fmt --all -- --check
      - name: Lint
        working-directory: ${{ steps.source.outputs.directory }}
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        working-directory: ${{ steps.source.outputs.directory }}
        run: cargo test --workspace --locked
      - name: Build documentation
        working-directory: ${{ steps.source.outputs.directory }}
        run: cargo doc --workspace --no-deps --locked
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install protocol verification tools
        working-directory: ${{ steps.source.outputs.directory }}
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify protocol npm packages
        working-directory: ${{ steps.source.outputs.directory }}
        run: |
          npm run verify:app-facade-routing
          npm run test:protocol-packages
          staging_root="$(mktemp -d)"
          trap 'rm -rf "$staging_root"' EXIT
          for protocol in artifact conversation appFacade core; do
            staging="$staging_root/$protocol"
            node scripts/stage-protocol-package.mjs "${protocol}" "${staging}"
            npm pack "${staging}" --dry-run
          done
      - name: Clean task source worktrees
        if: always()
        shell: bash
        run: |
          node - <<'JS'
          const fs = require('node:fs'), path = require('node:path');
          const file = path.join(process.env.RUNNER_TEMP, `foundation-source-${process.env.GITHUB_RUN_ID}-${process.env.GITHUB_JOB}-${process.env.GITHUB_RUN_ATTEMPT}.json`);
          if (fs.existsSync(file)) {
            const value = JSON.parse(fs.readFileSync(file, 'utf8'));
            require(value.helper).cleanup(value.work, value.root);
            fs.rmSync(file);
          }
          JS
