[package]
name = "mhome-ble-commission"
version = "0.6.3"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Platform-neutral BLE/LAN discovery, pod commissioning and Host provisioning for MeowLink native Clients"
readme = "README.md"
publish = ["crates-io"]
include = ["src/**", "tests/**", "Cargo.toml", "README.md", "LICENSE"]

[lib]
name = "ble_commission"

[dependencies]
host-protocol = { package = "mhome-host-auth", version = "=1.7.2", path = "../host-auth" }
app-facade-api = { package = "mhome-app-facade-api", version = "=1.45.0", path = "../app-facade-api" }
async-trait = "0.1"
core-api = { package = "mhome-core-api", version = "=1.41.0", path = "../core-api" }
protocomm = { package = "mhome-protocomm", version = "=0.2.0", path = "../protocomm" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
reqwest = { version = "0.12", default-features = false }
zeroize = "1"
uuid = { version = "1.11", features = ["v4"] }
base64 = "0.22"
ed25519-dalek = "2"

[dev-dependencies]
prost = "0.13"
tokio = { version = "1", features = ["macros", "rt", "sync", "test-util", "time", "io-util", "net"] }
